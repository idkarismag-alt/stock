name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q KISReplayAndroid_v2_Project.zip -d buildsrc
          echo "PROJECT_DIR=$(find buildsrc -maxdepth 1 -type d -name 'KISReplayAndroid_v2' | head -1)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" :app:assembleDebug --stacktrace

      - name: Copy APK
        run: cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" KISReplayAndroid-v2.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KISReplayAndroid-v2-APK
          path: KISReplayAndroid-v2.apk
          if-no-files-found: error
